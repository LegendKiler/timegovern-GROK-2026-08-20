<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeGovern — Global Time, World Clock, Astronomy & Timezone Platform</title>
    <meta name="description" content="TimeGovern is the premier global time platform: world clocks, timezone meeting planners, astronomy calculators, calendars, and live free news." />
    <link rel="canonical" href="https://timegovern.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex: enterprise / data clarity (not generic Inter stack) -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        margin: 0;
      }
      /* Defaults before React hydrates — dark preferred; light when html loses .dark */
      html.dark, html.dark body {
        background: #0f172a;
        color: #f8fafc;
      }
      html:not(.dark), html:not(.dark) body {
        background: #f1f5f9;
        color: #0f172a;
      }
      code, kbd, .font-mono, .tabular-nums {
        font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      .tg-time, .tg-time-display, .font-display {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      .tg-label {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 600;
        font-size: 0.65rem;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
