<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeGovern — Global Time, World Clock, Astronomy & Timezone Platform</title>
    <meta name="description" content="TimeGovern is the premier global time platform: world clocks, timezone meeting planners, astronomy calculators, calendars, and live free news." />
    <link rel="canonical" href="https://timegovern.com/" />

    <!--
      Font strategy (lab):
      timeanddate.com uses clean system sans (Arial/Helvetica-like).
      We use Inter as primary (better UI metrics) with system fallbacks
      so text never looks broken if Google Fonts is slow/blocked.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical fonts before JS/CSS bundle — prevents FOIT / mixed fonts */
      html, body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      code, kbd, .font-mono, .tabular-nums {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
