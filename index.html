<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeGovern — Global Time, World Clock, Astronomy & Timezone Platform</title>
    <meta name="description" content="TimeGovern is the premier global time governance authority, offering atomic precision world clocks, timezone meeting planners, astronomy calculators, worldometers, and real-time enterprise time APIs." />
    <meta name="keywords" content="TimeGovern, timegovern.com, world clock, global time, timezone converter, atomic time, IANA tzdata, meeting planner, sunrise sunset, worldometers" />
    <meta name="author" content="TimeGovern" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://timegovern.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timegovern.com/" />
    <meta property="og:site_name" content="TimeGovern" />
    <meta property="og:title" content="TimeGovern — Global Time, World Clock & Astronomy Governance" />
    <meta property="og:description" content="Atomic precision world clocks, global timezone planning, astronomical calculators, and real-time worldometer statistics powered by Cloudflare Workers Edge." />
    <meta property="og:image" content="https://timegovern.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://timegovern.com/" />
    <meta name="twitter:title" content="TimeGovern — Global Time, World Clock & Astronomy Governance" />
    <meta name="twitter:description" content="Atomic precision world clocks, global timezone planning, astronomical calculators, and real-time worldometer statistics." />

    <!-- Schema.org Structured Data for Google / AI Crawlers -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TimeGovern",
      "url": "https://timegovern.com",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "description": "Global time governance authority providing atomic-synchronized world clocks, timezone converters, meeting planners, astronomy tracking, and edge time APIs.",
      "publisher": {
        "@type": "Organization",
        "name": "TimeGovern",
        "url": "https://timegovern.com",
        "logo": "https://timegovern.com/logo.png"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://timegovern.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
