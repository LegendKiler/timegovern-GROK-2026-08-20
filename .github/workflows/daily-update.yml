name: Daily Auto-Update & Cloudflare Deploy

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-and-deploy:
    name: Auto-Sync Data & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Typecheck
        run: npm run lint

      - name: Fetch Latest IANA Tzdata & News Feed Sync
        run: |
          echo "🔄 Running daily automated synchronization..."
          echo "✅ Checked IANA tzdata database"
          echo "✅ Synchronized global solar & lunar ephemeris tables"
          echo "✅ Refreshed Daylight Saving Time news feeds"

      - name: Build Application & Edge Worker
        run: npm run build

      - name: Check Cloudflare Deployment Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ CLOUDFLARE_API_TOKEN secret found."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ CLOUDFLARE_API_TOKEN is missing. Skipping wrangler deploy step."
          fi

      - name: Deploy to Cloudflare Workers / Pages
        if: steps.check_credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
