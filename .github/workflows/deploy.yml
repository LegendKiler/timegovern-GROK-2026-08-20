name: Automated Cloudflare Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Assets & Worker Bundle
        run: npm run build

      - name: Check Cloudflare Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN secret found."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is empty — set to 391c74b6d00e4ed1a78ddfe6ce63ce56"
          fi

      # D1 often needs stronger token scopes; do not block site deploy if migrate fails
      - name: Apply Cloudflare D1 Database Migrations
        if: steps.check_credentials.outputs.has_token == 'true'
        continue-on-error: true
        id: d1_migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply zoneshift-db --remote -c wrangler.toml --yes

      - name: Deploy Worker to Cloudflare
        if: steps.check_credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.toml

      - name: Auto-Configure domain helpers (optional)
        if: steps.check_credentials.outputs.has_token == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: timegovern.com
        run: |
          if [ -f scripts/cloudflare-auto-fix.js ]; then
            node scripts/cloudflare-auto-fix.js || true
          fi
