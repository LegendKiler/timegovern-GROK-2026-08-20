name: Automated Cloudflare Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Assets & Worker Bundle
        run: npm run build

      - name: Check Cloudflare Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ CLOUDFLARE_API_TOKEN secret found."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning ::CLOUDFLARE_API_TOKEN secret is not set in GitHub Repository Secrets. Deployment steps will be skipped until configured."
            echo "--------------------------------------------------------"
            echo "To enable automatic deployment from GitHub to Cloudflare:"
            echo "1. Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: CLOUDFLARE_API_TOKEN | Value: <Your Cloudflare API Token>"
            echo "4. (Optional) Name: CLOUDFLARE_ACCOUNT_ID | Value: <Your Cloudflare Account ID>"
            echo "--------------------------------------------------------"
          fi

      - name: Apply Cloudflare D1 Database Migrations
        if: steps.check_credentials.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply zoneshift-db --remote -c wrangler.toml

      - name: Deploy Worker to Cloudflare (Custom Domains & Routing)
        if: steps.check_credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.toml

      - name: Auto-Configure Cloudflare Domain Security, Custom Domains & HTTPS
        if: steps.check_credentials.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: timegovern.com
        run: |
          node scripts/cloudflare-auto-fix.js || true

