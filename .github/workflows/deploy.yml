name: Automated Cloudflare Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab for testing

jobs:
  deploy:
    name: Build and Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Assets & Worker Bundle
        run: npm run build

      - name: Check Cloudflare Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ CLOUDFLARE_API_TOKEN secret found."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ CLOUDFLARE_API_TOKEN is missing in GitHub Repository Secrets."
          fi

      - name: Cleanup Duplicate Legacy Worker (timegovern-site2)
        if: steps.check_credentials.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler delete timegovern-site2 --force || echo "No legacy worker timegovern-site2 found or already cleaned up."

      - name: Apply Cloudflare D1 Database Migrations
        if: steps.check_credentials.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply zoneshift-db --remote -c wrangler.toml --batch

      - name: Deploy Master Worker to Cloudflare
        if: steps.check_credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.toml

