name: Automated Cloudflare Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Assets & Worker Bundle
        run: npm run build

      - name: Check Cloudflare Credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi
          echo "has_token=true" >> $GITHUB_OUTPUT
          echo "CLOUDFLARE_API_TOKEN secret found."

      # Non-interactive CI: do not pass --yes (unsupported). continue-on-error so site still deploys.
      - name: Apply Cloudflare D1 Database Migrations
        if: steps.check_credentials.outputs.has_token == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply zoneshift-db --remote -c wrangler.toml

      # Prefer plain wrangler over wrangler-action for clearer API errors
      - name: Deploy Worker to Cloudflare
        if: steps.check_credentials.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.toml

      - name: Auto-Configure domain helpers (optional)
        if: steps.check_credentials.outputs.has_token == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: timegovern.com
        run: |
          if [ -f scripts/cloudflare-auto-fix.js ]; then
            node scripts/cloudflare-auto-fix.js || true
          fi
