name = "timegovern-website"
main = "dist-worker/index.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Custom Domain Configuration (.com)
# To attach your custom domain timegovern.com:
# 1. In Cloudflare DNS Dashboard for timegovern.com, delete any old A or CNAME records.
# 2. In Cloudflare Workers Dashboard -> timegovern-website -> Settings -> Domains & Routes -> Add Custom Domain -> timegovern.com
# Uncomment below once existing DNS records are cleared:
# routes = [
#   { pattern = "timegovern.com", custom_domain = true },
#   { pattern = "www.timegovern.com", custom_domain = true }
# ]

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Database Configuration
[[d1_databases]]
binding = "DB"
database_name = "zoneshift-db"
database_id = "5de2ee4a-6d29-45d5-8fc6-c33fa6a24aa9"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ENABLE_EDGE_CACHE = "true"

[build]
command = "npm run build"
