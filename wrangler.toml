name = "timegovern-website"
main = "dist-worker/index.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# To enable Cloudflare D1 Database:
# 1. Run in terminal: npx wrangler d1 create zoneshift-db
# 2. Paste the generated database_id below and uncomment these lines:
# [[d1_databases]]
# binding = "DB"
# database_name = "zoneshift-db"
# database_id = "YOUR_D1_DATABASE_ID_HERE"
# migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ENABLE_EDGE_CACHE = "true"

[build]
command = "npm run build"
